name: release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
      
jobs:
  build-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["amd64"]
        os: ["windows"]
    timeout-minutes: 2

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Go
      id: go
      uses: actions/setup-go@v6.4.0
      with:
        go-version-file: 'go.mod'   
        cache: true
        cache-dependency-path: 'go.sum'

    - name: Go Tidy
      run: go mod tidy && git diff --exit-code

    - name: Go Mod
      run: go mod download

    - name: Go Mod Verify
      run: go mod verify
    
    - name: Build
      run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -o . -ldflags='-s -w -X "main.Version='${{ github.ref_name }}'"' ./cmd/verapack/

    - name: Create Archive
      run: |
        sudo apt-get install zip gzip tar
        mkdir out
        zip -j out/verapack-${{ matrix.os }}-${{ matrix.arch }}-${{ github.ref_name }}.zip verapack.* .install/batch/install.cmd

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7.0.0
      with:
        name: artefact-${{ matrix.os }}-${{ matrix.arch }}
        path: out/*.zip
        if-no-files-found: error
        overwrite: true       

  deploy-to-chocolatey:
    runs-on: ubuntu-latest
    needs: build-app
    if:  github.ref_type == 'tag' && vars.CHOCO_PUSH == 'true'
    steps:
      - id: sanitize-tag
        shell: bash
        run: echo "TAG=${TAG//v/}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

      - name: Download built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          merge-multiple: true
          path: out

      - name: Create chocolatey package
        uses: DanCreative/ghaction-chocolatey@v1
        with:
          args: pack --version "${{ steps.sanitize-tag.outputs.TAG }}" --outputdirectory choco .\.install\choco\verapack.nuspec
     
      - name: Publish to Chocolatey community
        uses: DanCreative/ghaction-chocolatey@v1
        with:
          args: push ".\choco\verapack.${{ steps.sanitize-tag.outputs.TAG }}.nupkg" -key ${{ secrets.CHOCO_API_KEY }} --source="https://push.chocolatey.org/"
  
  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && vars.RELEASE == 'true'
    needs: build-app
    steps:
    - name: Download built artifacts
      uses: actions/download-artifact@v8.0.1
      with:
        merge-multiple: true
        path: out

    - name: List files
      id: file-list
      run: |
        {
          echo 'MULTILINE_FILE_LIST<<EOF'
          find out -type f
          echo EOF
        } >> "$GITHUB_OUTPUT"
        
    # Documentation: https://github.com/softprops/action-gh-release
    - name: Create Github Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: ${{ steps.file-list.outputs.MULTILINE_FILE_LIST }}