name: checks
on: 
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
    vuln-check:
        runs-on: ubuntu-latest
        steps:
          - name: Set up Go
            id: go
            uses: actions/setup-go@v6.4.0
            with:
              go-version-file: 'go.mod'   
              cache: true
              cache-dependency-path: 'go.sum'
          
          - name: Install `govulncheck`
            run: go install golang.org/x/vuln/cmd/govulncheck@latest
            shell: bash

          - name: Run `govulncheck`
            id: govulncheck
            run: govulncheck ./...
            env:
              GOOS: windows