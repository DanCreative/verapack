name: checks
on: 
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
    vuln-check:
        runs-on: ubuntu-latest
        steps:
          - name: Golang SCA security check
            id: govulncheck
            uses: golang/govulncheck-action@v1
            with:
              go-version-file: go.mod